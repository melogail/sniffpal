; Keeps the Reverb websocket server alive on a production host.
; Copy to /etc/supervisor/conf.d/, set the paths and the user, then:
;   supervisorctl reread && supervisorctl update
; Needs BROADCAST_CONNECTION=reverb and the REVERB_* keys in .env; the web
; server proxies /app to REVERB_PORT.
[program:sniffpal-reverb]
command=php /var/www/sniffpal/artisan reverb:start
directory=/var/www/sniffpal
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/www/sniffpal/storage/logs/reverb.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
