; Keeps the Horizon queue master alive on a production host.
; Copy to /etc/supervisor/conf.d/, set the paths and the user, then:
;   supervisorctl reread && supervisorctl update
; Horizon serves the `redis` connection only; QUEUE_CONNECTION must be redis.
; `horizon:terminate` on deploy lets running jobs finish, hence the long wait.
[program:sniffpal-horizon]
command=php /var/www/sniffpal/artisan horizon
directory=/var/www/sniffpal
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/sniffpal/storage/logs/horizon.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
