; Keeps the Inertia SSR Node server alive on a production host.
; Copy to /etc/supervisor/conf.d/, set the three paths and the user, then:
;   supervisorctl reread && supervisorctl update
; `inertia:start-ssr` spawns node as a child, so the group flags make a
; stop/restart take node down with it instead of leaving port 13714 held.
[program:sniffpal-inertia-ssr]
command=php /var/www/sniffpal/artisan inertia:start-ssr
directory=/var/www/sniffpal
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/www/sniffpal/storage/logs/inertia-ssr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
